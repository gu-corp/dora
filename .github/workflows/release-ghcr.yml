name: Release (ghcr)

# Manual, tag-based release.
#
# Flow:
#   1. Create & push the tag on the exact commit you want to release:
#        git tag v1.2.3
#        git push origin v1.2.3
#   2. Actions tab -> "Release (ghcr)" -> Run workflow -> enter the tag (v1.2.3)
#
# The build checks out that exact tag, so the image always matches the tagged
# commit. It then pushes the multi-arch image to ghcr.io and creates a GitHub
# Release for the (already existing) tag.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing git tag to build & release (e.g. v1.2.3)"
        required: true
        type: string

permissions:
  contents: write   # needed to create the GitHub Release
  packages: write   # needed to push the image to ghcr.io

env:
  REGISTRY: ghcr.io
  # ghcr image name must be lowercase; github.repository (gu-corp/dora) already is.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      # Check out the exact tag being released (not the branch this workflow
      # was dispatched from) so the image matches the tagged commit.
      - name: Checkout tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify tag exists
        run: |
          if ! git rev-parse -q --verify "refs/tags/${{ inputs.tag }}" >/dev/null; then
            echo "::error::tag '${{ inputs.tag }}' not found. Push the tag before running this workflow."
            exit 1
          fi
          echo "Building tag ${{ inputs.tag }} @ $(git rev-parse --short HEAD)"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ inputs.tag }}
            type=raw,value=latest,enable=${{ !contains(inputs.tag, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Embeds the version into the binary via Dockerfile `ARG release` -> make RELEASE=...
          build-args: |
            release=${{ inputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag }}
          name: ${{ inputs.tag }}
          draft: false
          # tags containing a hyphen (v1.2.3-rc1) are treated as pre-releases
          prerelease: ${{ contains(inputs.tag, '-') }}
          generate_release_notes: true
          body: |
            ### Docker image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.tag }}
            ```
