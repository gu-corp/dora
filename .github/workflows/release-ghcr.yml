name: Release (ghcr)

# Manual release: publishing the Docker image and creating the GitHub Release
# only happen when this workflow is triggered by hand.
#
#   Actions tab -> "Release (ghcr)" -> Run workflow -> enter version (e.g. 1.2.3)
#
# It then builds the multi-arch image, pushes it to ghcr.io, and creates a
# matching GitHub Release (which also creates the v<version> git tag).
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version number WITHOUT leading v (e.g. 1.2.3)"
        required: true
        type: string

permissions:
  contents: write   # needed to create the GitHub Release + tag
  packages: write   # needed to push the image to ghcr.io

env:
  REGISTRY: ghcr.io
  # ghcr image name must be lowercase; github.repository (gu-corp/dora) already is.
  IMAGE_NAME: ${{ github.repository }}

jobs:
  docker:
    name: Build & push Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=v${{ inputs.version }}
            type=raw,value=latest,enable=${{ !contains(inputs.version, '-') }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Embeds the version into the binary via Dockerfile `ARG release` -> make RELEASE=...
          build-args: |
            release=v${{ inputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [docker]
    runs-on: ubuntu-latest
    steps:
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          draft: false
          # versions containing a hyphen (1.2.3-rc1) are treated as pre-releases
          prerelease: ${{ contains(inputs.version, '-') }}
          generate_release_notes: true
          body: |
            ### Docker image
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:v${{ inputs.version }}
            ```
